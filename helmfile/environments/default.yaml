# CHANGEME-* values are placeholders. Replace with a secrets manager or
# SOPS-encrypted values file before running `helmfile apply` for real.

cluster_fqdn: "tavros.example.com"
cluster_admin_email: "admin@tavros.example.com"

kubernetes_cluster:
  cloud_provider: "aws"
  keycloak:
    realm: prod
    client_secret: "CHANGEME-kubernetes-client-secret"

kong:
  enabled: true
  default_ingress_class: "prod"
  ee_creds:
    - name: default
      license: "CHANGEME-kong-ee-license-json"
  instances:
    - name: "sandbox-kong"
      hybrid: false
      ingress_class: "sandbox"
      kuma_mesh_name: "sandbox"
      pg:
        password: "CHANGEME-sandbox-kong-pg-password"
      ee:
        enabled: true
        creds: "default"
        admin_password: "CHANGEME-sandbox-kong-admin-password"
        keycloak:
          realm: "sandbox"
          client_secret: "CHANGEME-sandbox-kong-keycloak-client-secret"
    - name: "prod-kong"
      hybrid: false
      ingress_class: "prod"
      kuma_mesh_name: "prod"
      pg:
        password: "CHANGEME-prod-kong-pg-password"
      ee:
        enabled: true
        creds: "default"
        admin_password: "CHANGEME-prod-kong-admin-password"
        keycloak:
          realm: "prod"
          client_secret: "CHANGEME-prod-kong-keycloak-client-secret"

kuma:
  enabled: true
  meshes:
    - name: "sandbox"
      mtls:
        enabled: true
      traffictrace:
        enabled: true
    - name: "prod"
      mtls:
        enabled: true
      traffictrace:
        enabled: true

namespaces:
  - name: "dev"
    kuma_mesh_name: "sandbox"
  - name: "test"
    kuma_mesh_name: "sandbox"
  - name: "prod"
    kuma_mesh_name: "prod"

keycloak:
  enabled: true
  pg:
    password: "CHANGEME-keycloak-pg-password"
  realms:
    - name: sandbox
      admin_password: "CHANGEME-sandbox-realm-admin-password"
    - name: prod
      admin_password: "CHANGEME-prod-realm-admin-password"

postgresql:
  password: "CHANGEME-postgresql-password"
  postgres_password: "CHANGEME-postgresql-postgres-password"

cert_manager:
  enabled: true

sealed_secrets:
  # installed but unused: no release currently seals secrets with it
  enabled: true

gitea:
  enabled: true
  admin_password: "CHANGEME-gitea-admin-password"
  pg:
    password: "CHANGEME-gitea-pg-password"
  keycloak:
    realm: "prod"
    client_secret: "CHANGEME-gitea-keycloak-client-secret"

nexus:
  enabled: true
  keycloak:
    realm: "prod"
    client_secret: "CHANGEME-nexus-keycloak-client-secret"

elastic_cloud:
  enabled: true
  ee:
    enabled: false
    trial: true
    license: ""
    keycloak:
      realm: "prod"
      client_secret: "CHANGEME-elastic-cloud-keycloak-client-secret"

jaeger:
  enabled: true
  keycloak:
    realm: "prod"
    client_secret: "CHANGEME-jaeger-keycloak-client-secret"
  es:
    password: "CHANGEME-jaeger-es-password"

jenkins:
  enabled: true
  keycloak:
    realm: "prod"
    password: "CHANGEME-jenkins-keycloak-password"
  gitea:
    password: "CHANGEME-jenkins-gitea-password"
