---
# jaeger-operator v1.62.0 applied via presync kubectl-apply (no chart pinned here);
# jaegertracing.github.io/helm-charts publishes an official chart as a cleaner alternative.
releases:
  - name: jaeger-operator
    namespace: jaeger
    createNamespace: true
    chart: ../charts/raw-manifests
    values:
      - manifests: []
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "kubectl"
        args:
          - "apply"
          - "-f"
          - "https://github.com/jaegertracing/jaeger-operator/releases/download/v1.62.0/jaeger-operator.yaml"
          - "-n"
          - "jaeger"

  - name: jaeger-resources
    namespace: jaeger
    chart: ../charts/raw-manifests
    # also needs keycloak-resources (realm) and elastic-cloud-resources (ca.crt source); enforced by include order.
    needs:
      - jaeger/jaeger-operator
    values:
      - ../values/jaeger-resources.yaml.gotmpl
