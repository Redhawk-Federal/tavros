---
# jenkins-operator v0.8.0-beta2 has no Helm chart: CRD via presync kubectl-apply,
# operator Deployment/RBAC vendored in charts/raw-manifests/files/jenkins/.
releases:
  - name: jenkins-operator-crd
    namespace: jenkins
    createNamespace: true
    chart: ../charts/raw-manifests
    values:
      - manifests: []
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "kubectl"
        args:
          - "apply"
          - "-f"
          - "https://raw.githubusercontent.com/jenkinsci/kubernetes-operator/v0.8.0-beta2/config/crd/bases/jenkins.io_jenkins.yaml"

  - name: jenkins-resources
    namespace: jenkins
    chart: ../charts/raw-manifests
    # also needs keycloak-resources (realm) and gitea (CASC giteaServers config); enforced by include order.
    needs:
      - jenkins/jenkins-operator-crd
    values:
      - ../values/jenkins-resources.yaml.gotmpl
