---
# gitea v2.2.4 (https://dl.gitea.io/charts/)
releases:
  - name: gitea
    namespace: gitea
    createNamespace: true
    chart: gitea-charts/gitea
    version: 2.2.4
    needs:
      - gitea/gitea-resources
    values:
      - ../values/gitea.yaml.gotmpl

  - name: gitea-resources
    namespace: gitea
    chart: ../charts/raw-manifests
    # also needs keycloak-resources (realm); enforced by include order in helmfile.yaml.
    values:
      - ../values/gitea-resources.yaml.gotmpl
