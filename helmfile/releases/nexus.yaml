---
# nexus-repository-manager v64.2.0 (https://sonatype.github.io/helm3-charts/)
releases:
  - name: nexus
    namespace: nexus
    createNamespace: true
    chart: sonatype/nexus-repository-manager
    version: 64.2.0
    needs:
      - nexus/nexus-resources
    values:
      - ../values/nexus.yaml.gotmpl

  - name: nexus-resources
    namespace: nexus
    chart: ../charts/raw-manifests
    # also needs keycloak-resources (realm); enforced by include order in helmfile.yaml.
    values:
      - ../values/nexus-resources.yaml.gotmpl
