---
# keycloak-operator v19.0.3 has no Helm chart (legacy, archived upstream;
# the current Keycloak Operator is an unrelated v2alpha1 project) - applied
# via presync kubectl-apply instead of Helm managing it directly.
releases:
  - name: keycloak-operator
    namespace: keycloak
    createNamespace: true
    chart: ../charts/raw-manifests
    values:
      - manifests: []
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "kubectl"
        args:
          - "apply"
          - "-f"
          - "https://raw.githubusercontent.com/keycloak/keycloak-operator/19.0.3/deploy/crds/keycloak.org_keycloakbackups_crd.yaml"
          - "-f"
          - "https://raw.githubusercontent.com/keycloak/keycloak-operator/19.0.3/deploy/crds/keycloak.org_keycloakclients_crd.yaml"
          - "-f"
          - "https://raw.githubusercontent.com/keycloak/keycloak-operator/19.0.3/deploy/crds/keycloak.org_keycloakrealms_crd.yaml"
          - "-f"
          - "https://raw.githubusercontent.com/keycloak/keycloak-operator/19.0.3/deploy/crds/keycloak.org_keycloaks_crd.yaml"
          - "-f"
          - "https://raw.githubusercontent.com/keycloak/keycloak-operator/19.0.3/deploy/crds/keycloak.org_keycloakusers_crd.yaml"
          - "-n"
          - "keycloak"
          - "-f"
          - "https://raw.githubusercontent.com/keycloak/keycloak-operator/19.0.3/deploy/role.yaml"
          - "-f"
          - "https://raw.githubusercontent.com/keycloak/keycloak-operator/19.0.3/deploy/role_binding.yaml"
          - "-f"
          - "https://raw.githubusercontent.com/keycloak/keycloak-operator/19.0.3/deploy/service_account.yaml"
          - "-f"
          - "https://raw.githubusercontent.com/keycloak/keycloak-operator/19.0.3/deploy/operator.yaml"

  - name: keycloak-resources
    namespace: keycloak
    chart: ../charts/raw-manifests
    # also needs cert-manager-resources (ClusterIssuer); enforced only by include order in helmfile.yaml.
    needs:
      - keycloak/keycloak-operator
    values:
      - ../values/keycloak-resources.yaml.gotmpl
