---
# roles/sealed_secrets ported.
#
# Judgment call: the Ansible role does NOT install a Helm chart today - it
# kustomize-applies the upstream bitnami-labs/sealed-secrets v0.27.0
# `controller.yaml` release asset directly (see
# roles/sealed_secrets/files/kustomization.yaml). Per the task brief, we
# switch to the official bitnami-labs/sealed-secrets Helm chart so Helmfile
# has a real chart to manage here instead of a vendored URL. Chart version
# 2.16.0 carries appVersion 0.27.1, the closest published chart release to
# the pinned controller v0.27.0 (no chart build was published for exactly
# 0.27.0) - verify/bump this before relying on it for real.
#
# Nothing in this POC actually uses SealedSecrets to encrypt anything
# (see README "Secrets" section) - it's installed for parity with today's
# cluster only, so a future pass can wire real secret encryption through it
# (or through SOPS) without re-deciding the chart.
releases:
  - name: sealed-secrets
    namespace: sealed-secrets
    createNamespace: true
    chart: sealed-secrets/sealed-secrets
    version: 2.16.0
    values:
      - ../values/sealed-secrets.yaml.gotmpl
