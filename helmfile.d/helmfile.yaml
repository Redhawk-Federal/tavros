---
# Tavros platform - Helmfile GitOps POC
#
# This is the single entrypoint. It replaces:
#   - the Ansible roles under roles/* that Jinja2-templated Helm values and
#     raw manifests and applied them once via ms3_inc.tavros.kube/kustomize
#   - Flux v2 (fluxtoolkit/fluxtoolkit_sync), which continued reconciling the
#     rendered manifests committed to Gitea
#
# with one declarative tool: every release below is Helmfile's source of
# truth, and the intended day-2 loop is:
#   push to the Gitea platform-manifests repo
#     -> Gitea webhook (roles/jenkins/tasks/gitea_setup.yaml) triggers Jenkins
#     -> `helmfile diff` on PR, `helmfile apply` on merge to main
# See README.md for the full architecture writeup, what's ported vs. out of
# scope, and a sample Jenkins pipeline stage (examples/Jenkinsfile.stage).

environments:
  default:
    values:
      - environments/default.yaml
  sandbox:
    values:
      - environments/default.yaml
      # - environments/sandbox.yaml  # TODO: per-environment overrides go here
  prod:
    values:
      - environments/default.yaml
      # - environments/prod.yaml

repositories:
  - name: jetstack
    url: https://charts.jetstack.io
  - name: sealed-secrets
    # the bitnami-labs.github.io Pages URL used in most docs/tutorials 404s
    # now; bitnami.github.io is the one that's actually live.
    url: https://bitnami.github.io/sealed-secrets
  - name: kuma
    url: https://kumahq.github.io/charts
  - name: kong
    url: https://charts.konghq.com
  - name: gitea-charts
    url: https://dl.gitea.io/charts/
  - name: sonatype
    url: https://sonatype.github.io/helm3-charts/

# Every nested state file below needs `inherits` to see this file's
# `environments:` (so .Environment.Values works inside releases/*.yaml and
# values/*.yaml.gotmpl) and `repositories:` (so `chart: <repo>/<name>`
# resolves) - Helmfile does not inherit either into `helmfiles:` includes by
# default.
helmfiles:
  - path: releases/namespaces.yaml
    inherits: ["environments", "repositories"]
  - path: releases/cert-manager.yaml
    inherits: ["environments", "repositories"]
  - path: releases/sealed-secrets.yaml
    inherits: ["environments", "repositories"]
  - path: releases/postgresql.yaml
    inherits: ["environments", "repositories"]
  - path: releases/kuma.yaml
    inherits: ["environments", "repositories"]
  - path: releases/kong.yaml.gotmpl
    inherits: ["environments", "repositories"]
  - path: releases/keycloak.yaml
    inherits: ["environments", "repositories"]
  - path: releases/nexus.yaml
    inherits: ["environments", "repositories"]
  - path: releases/elastic-cloud.yaml
    inherits: ["environments", "repositories"]
  - path: releases/jaeger.yaml
    inherits: ["environments", "repositories"]
  - path: releases/gitea.yaml
    inherits: ["environments", "repositories"]
  - path: releases/jenkins.yaml
    inherits: ["environments", "repositories"]
